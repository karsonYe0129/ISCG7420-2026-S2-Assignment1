{% extends "clinic/base.html" %}

{% block title %}{{ page_title }} | Piki Ora Medical Center{% endblock %}

{% block content %}
<section class="card form-panel">
    <h1>{{ page_title }}</h1>
    <p class="muted">All times are in Auckland local time.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save slot</button>
    </form>

    <p>
        <a href="{% url 'manage_appointments' %}">
            Back to consultation slots
        </a>
    </p>
</section>
{% endblock %}
